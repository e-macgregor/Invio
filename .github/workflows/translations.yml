name: Check Mexican Spanish translations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - frontend/src/lib/i18n/locales/en.json
      - frontend/src/lib/i18n/locales/es-mx.json
      - .github/scripts/check_es_mx.py
      - .github/workflows/translations.yml
  pull_request:
    branches: [main]
    paths:
      - frontend/src/lib/i18n/locales/en.json
      - frontend/src/lib/i18n/locales/es-mx.json
      - .github/scripts/check_es_mx.py
      - .github/workflows/translations.yml

permissions:
  contents: read

jobs:
  check_translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate es-MX catalog
        run: python .github/scripts/check_es_mx.py
